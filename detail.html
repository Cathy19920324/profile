<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品详情 | UI/UX 作品集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #020B13;
            --bg-secondary: #0a1622;
            --gradient-primary: linear-gradient(135deg, #7B4AFF 0%, #2991F1 100%);
            --gradient-primary-soft: linear-gradient(135deg, rgba(123, 74, 255, 0.15) 0%, rgba(41, 145, 241, 0.15) 100%);
            --color-primary: #7B4AFF;
            --color-secondary: #2991F1;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #FFFFFF;
            --text-secondary: #B0C4DE;
            --text-weak: #6A7F96;
            --max-width: 1280px;
            --nav-height: 70px;
            --radius-card: 12px;
            --radius-btn: 50px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        a { text-decoration: none; color: inherit; }
        ul, ol { list-style: none; }
        img { max-width: 100%; display: block; }

        /* 顶部导航 */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: rgba(2, 11, 19, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            transition: all var(--transition);
        }

        .back-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* 详情页主体 */
        .detail-main {
            padding-top: calc(var(--nav-height) + 40px);
            padding-bottom: 80px;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        /* 面包屑 */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-weak);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }

        .breadcrumb a:hover { color: var(--text-secondary); }
        .breadcrumb .sep { opacity: 0.5; }

        /* 主标题区 */
        .detail-header {
            margin-bottom: 48px;
            animation: fadeInDown 0.6s ease;
        }

        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tag {
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-secondary);
            background: rgba(41, 145, 241, 0.1);
            border: 1px solid rgba(41, 145, 241, 0.2);
            border-radius: 4px;
        }

        .tag.purple {
            color: var(--color-primary);
            background: rgba(123, 74, 255, 0.1);
            border-color: rgba(123, 74, 255, 0.2);
        }

        .detail-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .detail-subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-secondary);
            line-height: 1.7;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 区块标题 */
        .block-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .block-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--gradient-primary);
            border-radius: 2px;
        }

        /* 图片画廊 */
        .gallery {
            margin-bottom: 56px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-card);
            overflow: hidden;
            background: var(--gradient-primary-soft);
            border: 1px solid var(--card-border);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(123, 74, 255, 0.2);
        }

        .gallery-item .img-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        .gallery-item .img-placeholder.alt-1 { background: linear-gradient(135deg, #7B4AFF 0%, #4C6EF5 100%); }
        .gallery-item .img-placeholder.alt-2 { background: linear-gradient(135deg, #2991F1 0%, #15C7C7 100%); }
        .gallery-item .img-placeholder.alt-3 { background: linear-gradient(135deg, #7B4AFF 0%, #2991F1 100%); }
        .gallery-item .img-placeholder.alt-4 { background: linear-gradient(135deg, #4C6EF5 0%, #7B4AFF 100%); }
        .gallery-item .img-placeholder.alt-5 { background: linear-gradient(135deg, #15C7C7 0%, #2991F1 100%); }

        .gallery-item .img-placeholder .img-icon {
            width: 48px;
            height: 48px;
            opacity: 0.6;
        }

        .gallery-item .img-placeholder .img-label {
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            padding: 0 16px;
        }

        /* 视频区 */
        .video-section {
            margin-bottom: 56px;
        }

        .video-wrapper {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: var(--radius-card);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--card-border);
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, rgba(123, 74, 255, 0.2) 0%, rgba(41, 145, 241, 0.2) 100%);
        }

        .play-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(123, 74, 255, 0.4);
            cursor: pointer;
            transition: transform var(--transition);
        }

        .play-btn:hover { transform: scale(1.1); }

        .play-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
            margin-left: 4px;
        }

        .video-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 右下角二维码 */
        .float-contact {
            position: fixed;
            bottom: 20px; right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: transform var(--transition);
        }

        .float-contact:hover { transform: scale(1.05); }

        .qr-wrapper {
            width: 120px; height: 120px;
            background: white;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .qr-wrapper svg { width: 100%; height: 100%; }

        .float-contact-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .detail-main {
                padding-top: calc(var(--nav-height) + 24px);
                padding-bottom: 48px;
            }
            .float-contact { bottom: 16px; right: 16px; }
            .qr-wrapper { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>

        <div class="nav-container">
            <a href="index.html" class="nav-logo">PORTFOLIO</a>
            <a href="index.html" class="back-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

        </div>
        <span class="float-contact-label">联系我</span>

    <script src="works-data.js"></script>
    <script>
        // 从URL获取参数
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const id = params.get('id');

        // 渐变色数组，用于图片占位
        const altClasses = ['alt-1', 'alt-2', 'alt-3', 'alt-4', 'alt-5'];

        // 渲染详情页
        function renderDetail() {
            const main = document.getElementById('detailMain');
            const work = getWorkById(type, id);

            if (!work) {
                main.innerHTML = `
                    <div style="text-align:center; padding: 80px 0;">
                        <h2 style="font-size: 2rem; margin-bottom: 16px;">作品未找到</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 24px;">该作品不存在或已被移除</p>
                        <a href="index.html" class="back-btn" style="display:inline-flex; padding: 12px 24px; background: var(--gradient-primary); color: white; border-radius: 50px;">返回首页</a>
                    </div>
                `;
                return;
            }

            // 面包屑
            const categoryLabel = work.category === 'ui' ? 'UI设计作品' : '平面&运营作品';

            // 标签
            const tagsHtml = work.tags
                ? `<div class="detail-tags">${work.tags.map(t => `<span class="tag ${t === '人工智能' ? 'purple' : ''}">${t}</span>`).join('')}</div>`
                : '';

            // 图片画廊
            const imagesHtml = work.images && work.images.length > 0
                ? `
                    <section class="gallery">
                        <h2 class="block-title">作品图片</h2>
                        <div class="gallery-grid">
                            ${work.images.map((img, i) => `
                                <div class="gallery-item">
                                    <div class="img-placeholder ${altClasses[i % altClasses.length]}">
                                        <svg class="img-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                        <span class="img-label">${img}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `
                : '';

            // 视频区
            const videoHtml = work.video
                ? `
                    <section class="video-section">
                        <h2 class="block-title">项目视频</h2>
                        <div class="video-wrapper">
                            <div class="video-placeholder">
                                <div class="play-btn">
                                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                                <span class="video-label">${work.video}</span>
                            </div>
                        </div>
                    </section>
                `
                : '';

            main.innerHTML = `
                <nav class="breadcrumb">
                    <a href="index.html">首页</a>
                    <span class="sep">/</span>
                    <a href="index.html#${work.category === 'ui' ? 'ui-works' : 'graphic-works'}">${categoryLabel}</a>
                    <span class="sep">/</span>
                    <span style="color: var(--text-secondary);">${work.title}</span>
                </nav>

                <header class="detail-header">
                    ${tagsHtml}
                    <h1 class="detail-title">${work.title}</h1>
                    <p class="detail-subtitle">${work.subtitle || work.desc || ''}</p>
                </header>

                ${imagesHtml}
                ${videoHtml}
            `;
        }

        renderDetail();
    </script>
</body>
</html>
